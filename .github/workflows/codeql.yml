name: Public CodeQL

on:
  # Enable after the Actions baseline has been reviewed; no automatic first run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Initialize JavaScript and TypeScript analysis without a build
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze and upload code-scanning results
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
